services:
  postgres:
    image: postgres:16-alpine
    container_name: bitget-integrity-postgres
    environment:
      POSTGRES_DB: bitget_research
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitget_research"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - bitget_integrity_postgres:/var/lib/postgresql/data

volumes:
  bitget_integrity_postgres:
